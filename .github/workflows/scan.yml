name: cpp-intern-radar

# 云端定时扫描：GitHub 的服务器按点执行，本地电脑无需开机。
# cron 一律用 UTC：北京时间 = UTC + 8
#
# 为什么是这些时刻（全部刻意避开整点，且在 UTC 深夜低负载带多铺几个点）：
#   1) GitHub 官方说明：schedule 的负载高峰是「每个小时的整点」，此时会延迟几分钟到几十分钟，
#      极端情况整次跳过。2026-10-02 实测 `0 10 * * *`（北京 18:00）整次未触发，盯 95 分钟仍是 0 条。
#   2) 于是所有时刻都取小时中段的分钟（17/23/37/47/53），且尽量落在 UTC 02:00–09:00（美国深夜）这段最空的窗口。
#   3) 一天铺 6 个点互为兜底：某次被跳过，后面几小时内还有一次，不会一整天漏掉。
#   4) 有 state/sent-jobs.json 台账去重，多跑不会重复发信，只会在出现新岗位时才发邮件。
on:
  schedule:
    - cron: '23 0 * * *'   # 北京 08:23 早报（UTC 00:23，已避开 UTC 00:00 这个全天最挤的点）
    - cron: '23 2 * * *'   # 北京 10:23（UTC 02:23，美国深夜，低负载）
    - cron: '37 4 * * *'   # 北京 12:37（UTC 04:37，美国深夜，低负载）
    - cron: '47 8 * * *'   # 北京 16:47（UTC 08:47，美国凌晨，低负载）
    - cron: '37 10 * * *'  # 北京 18:37 晚报（UTC 10:37，美国上班前，较空）
    - cron: '53 13 * * *'  # 北京 21:53（UTC 13:53，小时中段，避开整点）
  workflow_dispatch:
    inputs:
      limit:
        description: '本轮最多输出岗位数'
        required: false
        default: '10'
      enrich:
        description: '详情页富化上限（越大越慢越全）'
        required: false
        default: '60'
      no_mail:
        description: '只扫描不发邮件（true/false）'
        required: false
        default: 'false'
      curated:
        description: '人工核实轮清单文件（留空则走自动扫描），例如 data/round-2026-10-02.json。填了就完全离线，不采集不富化'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: cpp-intern-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 离线自检（不联网，秒级）
        run: node test/run-tests.mjs

      - name: 扫描岗位并发送邮件
        env:
          # 在仓库 Settings → Secrets and variables → Actions 里配置：
          #   GMAIL_USER         = 你的 Gmail 地址
          #   GMAIL_APP_PASSWORD = Gmail 应用专用密码（16 位，开启两步验证后生成）
          #   MAIL_TO            = 收件地址（可省略，默认发给 GMAIL_USER）
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          ARGS="--task scan --limit ${{ github.event.inputs.limit || '10' }} --min 6 --enrich ${{ github.event.inputs.enrich || '60' }}"
          if [ -n "${{ github.event.inputs.curated }}" ]; then ARGS="$ARGS --curated ${{ github.event.inputs.curated }} --curated-only"; fi
          if [ "${{ github.event.inputs.no_mail }}" = "true" ]; then ARGS="$ARGS --no-mail"; fi
          node src/main.js $ARGS

      - name: 提交报告与去重台账
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output state || true
          if git diff --cached --quiet; then
            echo "本次没有变化，跳过提交"
          else
            git commit -m "chore(radar): 报告与台账 $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push
          fi

      - name: 上传报告产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-intern-radar-report
          path: output/
          retention-days: 30
